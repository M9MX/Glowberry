# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.5.1
maven_group=org.m9mx.cactus.glowberry
archives_base_name=glowberry

# Dependencies / Third party
fabric_api_version=0.145.1+26.1
cactus_mod_version=0.13

# Extra
authors=[\
  "M9MX",\
  "Error Dev"\
 ]

# Final Glowberry version per Minecraft version
# Format: final_mod_version-{mcVersion}={glowberryVersion}
# -1 = no cutoff, always check for updates
# Any version number = this is the last Glowberry for that MC version
final_mod_version-26.1=-1